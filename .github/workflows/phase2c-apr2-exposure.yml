name: Phase 2C April 2 exposure

on:
  push:
    branches:
      - feature/phase2c-reciprocal-scope-engine
    paths:
      - research/trade_policy_alpha/build_apr2_annex2_exposure.py
      - research/trade_policy_alpha/build_apr2_whole_article_exclusions.py
      - research/trade_policy_alpha/build_apr2_policy_impact_sensitivity.py
      - research/trade_policy_alpha/data/section232_auto_scope_2025_04_02.csv
      - .github/workflows/phase2c-apr2-exposure.yml
  workflow_dispatch:

jobs:
  build-apr2-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research parser dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1

      - name: Build GDP-normalized PolicyImpact sensitivity surface
        run: |
          python research/trade_policy_alpha/build_apr2_policy_impact_sensitivity.py \
            --out-dir /tmp/phase2c-apr2

      - name: Show country diagnostics and rank stability
        run: |
          cat /tmp/phase2c-apr2/apr2_policy_impact_country_diagnostics.csv
          cat /tmp/phase2c-apr2/apr2_policy_impact_rank_stability.csv
          cat /tmp/phase2c-apr2/apr2_policy_impact_sensitivity_audit.json

      - name: Upload Phase 2C research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-apr2-policy-impact-sensitivity
          path: /tmp/phase2c-apr2
          if-no-files-found: error
          retention-days: 30
